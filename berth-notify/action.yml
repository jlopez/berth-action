name: berth-notify
description: >
  Notify the self-hosted `berth` runner: assemble the contract JSON body, sign it
  with HMAC-SHA256 over the exact bytes, POST it, and (by default) wait until the
  stack actually docks before returning — so CI goes green only on a successful
  deploy. No-ops (with a notice) when `webhook-secret` is empty, so a vessel stays
  green before berth is configured.

# Self-contained and dependency-free (bash + jq + openssl + curl, all present on
# GitHub runners). The body and the secrets blob carry secrets, so this action
# NEVER runs `set -x` and NEVER echoes either; multiline input is read from an
# env var, never argv.

inputs:
  webhook-secret:
    description: >
      Shared `berth_webhook_secret` (the vessel's `BERTH_WEBHOOK_SECRET`). When
      empty the action emits a notice and exits 0 without POSTing — this replaces
      the old `has_berth` plumbing and leaves room for a future secret-less
      GitHub-OIDC mode.
    required: false
    default: ''
  webhook-url:
    description: The berth webhook endpoint.
    default: 'https://webhook.jesusla.com/hooks/berth'
  repo:
    description: "`owner/name` of the vessel being deployed."
    default: ${{ github.repository }}
  ref:
    description: Commit SHA to deploy (from berth-plan `ref`).
    required: true
  instance:
    description: "`pr-<n>` or `main` (from berth-plan `instance`)."
    required: true
  host-base:
    description: Caddy hostname base, no trailing dash (from berth-plan `host-base`).
    required: true
  tag:
    description: Image tag the build pushed (from berth-plan `tag`).
    required: true
  action:
    description: "`up` or `down` (from berth-plan `action`)."
    required: true
  secrets:
    description: >
      Multiline `KEY=value` blob (one per line) forwarded to the stack host-side
      (written into the compose `env` file). Lines with an empty value are
      dropped (so unset Actions secrets never appear in the body); each line is
      split on the FIRST `=` only, so values may contain `=`.
    required: false
    default: ''
  wait:
    description: >
      When `'true'` (default) the action polls the runner after POSTing and only
      exits 0 once the stack reaches a terminal `success`, failing the step on
      `failure` or timeout. Set `'false'` for the old fire-and-forget behaviour.
    required: false
    default: 'true'
  wait-timeout:
    description: >
      Overall budget (seconds) for the whole wait — including time the deploy
      spends QUEUED behind other deploys on the single-flock host. Default 900
      (15 min).
    required: false
    default: '900'
  wait-running-timeout:
    description: >
      Seconds the deploy may stay in `running` (containers up, waiting for health)
      before the action gives up. The host itself fails an unhealthy stack within
      its own `berth_wait_timeout` (~60s) and reports `failure`, so this is just a
      backstop for a host that died mid-deploy. Default 120.
    required: false
    default: '120'
  poll-interval:
    description: Seconds between status polls while waiting.
    required: false
    default: '5'
  status-url:
    description: >
      Status-readback endpoint. Defaults to the `webhook-url` with its trailing
      `/berth` replaced by `/berth-status`; set explicitly only for a non-standard
      layout.
    required: false
    default: ''

outputs:
  deploy-id:
    description: >
      The per-run correlation token (`run_id-run_attempt`) sent as `deploy_id` and
      used to poll status. Empty when the action no-ops (no `webhook-secret`).
    value: ${{ steps.notify.outputs.deploy-id }}

runs:
  using: composite
  steps:
    - id: notify
      shell: bash
      env:
        BERTH_SECRET: ${{ inputs.webhook-secret }}
        BERTH_URL: ${{ inputs.webhook-url }}
        REPO: ${{ inputs.repo }}
        REF: ${{ inputs.ref }}
        INSTANCE: ${{ inputs.instance }}
        HOST_BASE: ${{ inputs.host-base }}
        TAG: ${{ inputs.tag }}
        ACTION: ${{ inputs.action }}
        SECRETS: ${{ inputs.secrets }}
        WAIT: ${{ inputs.wait }}
        WAIT_TIMEOUT: ${{ inputs.wait-timeout }}
        WAIT_RUNNING_TIMEOUT: ${{ inputs.wait-running-timeout }}
        POLL_INTERVAL: ${{ inputs.poll-interval }}
        STATUS_URL: ${{ inputs.status-url }}
        # Unique per CI run and per re-run, so a re-run gets a fresh status file.
        DEPLOY_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        set -euo pipefail

        if [ -z "${BERTH_SECRET:-}" ]; then
          echo "::notice::berth not configured — skipping notify"
          echo "deploy-id=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        echo "deploy-id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

        # HMAC-SHA256 over the exact bytes, matching the host's X-Hub-Signature-256.
        sign() { printf '%s' "$1" | openssl dgst -sha256 -hmac "$BERTH_SECRET" -hex | awk '{print $2}'; }

        # Parse the multiline KEY=value blob into a JSON object: drop blank lines
        # and lines with an empty value, split on the first `=` only. Read from
        # the env var (never argv) — the blob carries secrets.
        secrets_json=$(printf '%s\n' "$SECRETS" | jq -Rn '
          [ inputs
            | select(length > 0 and (index("=") != null))
            | capture("^(?<k>[^=]+)=(?<v>.*)$")
            | select(.v != "")
            | {key: .k, value: .v}
          ] | from_entries')

        # The body shape is the published contract — it lives in body.jq (the
        # single source of truth, validated in CI against
        # schema/berth-payload.v1.json) so the wire format and the schema the host
        # vendors can't drift apart. `v` (the contract version) is set there.
        body=$(jq -nc \
          --arg repo "$REPO" --arg ref "$REF" --arg instance "$INSTANCE" \
          --arg host_base "$HOST_BASE" --arg tag "$TAG" --arg action "$ACTION" \
          --arg deploy_id "$DEPLOY_ID" \
          --argjson secrets "$secrets_json" \
          -f "$GITHUB_ACTION_PATH/body.jq")

        # Never echo $body — it carries secrets (GitHub also masks them). Sign the
        # exact bytes that are POSTed.
        printf '%s' "$body" | curl -fsS -X POST "$BERTH_URL" \
          -H 'Content-Type: application/json' \
          -H "X-Hub-Signature-256: sha256=$(sign "$body")" \
          --data-binary @-
        echo "berth: ${ACTION} ${INSTANCE} announced (deploy ${DEPLOY_ID})"

        if [ "$WAIT" != "true" ]; then
          exit 0
        fi

        # Status endpoint: derive from the webhook URL unless given. Default
        # webhook-url ends in /berth → /berth-status.
        poll_url="${STATUS_URL:-}"
        if [ -z "$poll_url" ]; then
          base="${BERTH_URL%/}"            # tolerate a trailing slash
          poll_url="${base%/berth}/berth-status"
        fi

        # The poll body is non-secret (just the id); sign it once — the id is
        # fixed for the whole wait.
        qbody=$(jq -nc --arg id "$DEPLOY_ID" '{deploy_id: $id}')
        qsig=$(sign "$qbody")

        echo "berth: waiting for ${INSTANCE} to dock (timeout ${WAIT_TIMEOUT}s)…"
        deadline=$(( $(date +%s) + WAIT_TIMEOUT ))
        running_deadline=0
        state=''
        while :; do
          now=$(date +%s)
          if [ "$now" -ge "$deadline" ]; then
            echo "::error::berth: timed out after ${WAIT_TIMEOUT}s waiting for ${INSTANCE} (last state: ${state:-none})"
            exit 1
          fi

          # A transient curl/jq hiccup must not fail the wait — treat it as
          # "unknown" and keep polling until the overall deadline.
          resp=$(printf '%s' "$qbody" | curl -fsS -X POST "$poll_url" \
            -H 'Content-Type: application/json' \
            -H "X-Hub-Signature-256: sha256=$qsig" \
            --data-binary @- 2>/dev/null) || resp=''
          new_state=$(printf '%s' "$resp" | jq -r '.state // "unknown"' 2>/dev/null || true)
          [ -n "$new_state" ] || new_state='unknown'

          if [ "$new_state" != "$state" ]; then
            state="$new_state"
            echo "berth: ${INSTANCE} → ${state}"
            # Arm the backstop once, on the FIRST time we see running, and never
            # rewind it — otherwise a running↔unknown flap (transient poll errors)
            # would keep pushing the deadline out and defeat the backstop.
            if [ "$state" = "running" ] && [ "$running_deadline" -eq 0 ]; then
              running_deadline=$(( now + WAIT_RUNNING_TIMEOUT ))
            fi
          fi

          case "$state" in
            success) echo "berth: ${INSTANCE} docked ✓"; exit 0 ;;
            failure)
              # The host serves a safe, non-secret one-line reason in the
              # terminal failure status. Surface it so the vessel author needn't
              # SSH the host to learn why. Default empty for older hosts.
              reason=$(printf '%s' "$resp" | jq -r '.reason // ""' 2>/dev/null || true)
              echo "::error::berth: ${INSTANCE} failed to dock${reason:+: ${reason}}"
              exit 1
              ;;
          esac

          if [ "$running_deadline" -ne 0 ] && [ "$now" -ge "$running_deadline" ]; then
            echo "::error::berth: ${INSTANCE} stuck in 'running' for ${WAIT_RUNNING_TIMEOUT}s — host may have died mid-deploy"
            exit 1
          fi

          sleep "$POLL_INTERVAL"
        done
