name: berth-notify
description: >
  Notify the self-hosted `berth` runner: assemble the contract JSON body, sign it
  with HMAC-SHA256 over the exact bytes, and POST it. No-ops (with a notice) when
  `webhook-secret` is empty, so a vessel stays green before berth is configured.

# Self-contained and dependency-free (bash + jq + openssl + curl, all present on
# GitHub runners). The body and the secrets blob carry secrets, so this action
# NEVER runs `set -x` and NEVER echoes either; multiline input is read from an
# env var, never argv.

inputs:
  webhook-secret:
    description: >
      Shared `berth_webhook_secret` (the vessel's `BERTH_WEBHOOK_SECRET`). When
      empty the action emits a notice and exits 0 without POSTing — this replaces
      the old `has_berth` plumbing and leaves room for a future secret-less
      GitHub-OIDC mode.
    required: false
    default: ''
  webhook-url:
    description: The berth webhook endpoint.
    default: 'https://webhook.jesusla.com/hooks/berth'
  repo:
    description: "`owner/name` of the vessel being deployed."
    default: ${{ github.repository }}
  ref:
    description: Commit SHA to deploy (from berth-plan `ref`).
    required: true
  instance:
    description: "`pr-<n>` or `main` (from berth-plan `instance`)."
    required: true
  host-prefix:
    description: Caddy subdomain prefix (from berth-plan `host-prefix`).
    required: true
  tag:
    description: Image tag the build pushed (from berth-plan `tag`).
    required: true
  action:
    description: "`up` or `down` (from berth-plan `action`)."
    required: true
  secrets:
    description: >
      Multiline `KEY=value` blob (one per line) forwarded to the stack host-side
      (written into the compose `env` file). Lines with an empty value are
      dropped (so unset Actions secrets never appear in the body); each line is
      split on the FIRST `=` only, so values may contain `=`.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - id: notify
      shell: bash
      env:
        BERTH_SECRET: ${{ inputs.webhook-secret }}
        BERTH_URL: ${{ inputs.webhook-url }}
        REPO: ${{ inputs.repo }}
        REF: ${{ inputs.ref }}
        INSTANCE: ${{ inputs.instance }}
        HOST_PREFIX: ${{ inputs.host-prefix }}
        TAG: ${{ inputs.tag }}
        ACTION: ${{ inputs.action }}
        SECRETS: ${{ inputs.secrets }}
      run: |
        set -euo pipefail

        if [ -z "${BERTH_SECRET:-}" ]; then
          echo "::notice::berth not configured — skipping notify"
          exit 0
        fi

        # Parse the multiline KEY=value blob into a JSON object: drop blank lines
        # and lines with an empty value, split on the first `=` only. Read from
        # the env var (never argv) — the blob carries secrets.
        secrets_json=$(printf '%s\n' "$SECRETS" | jq -Rn '
          [ inputs
            | select(length > 0 and (index("=") != null))
            | capture("^(?<k>[^=]+)=(?<v>.*)$")
            | select(.v != "")
            | {key: .k, value: .v}
          ] | from_entries')

        # The body shape is the published contract — it lives in body.jq (the
        # single source of truth, validated in CI against
        # schema/berth-payload.v1.json) so the wire format and the schema the host
        # vendors can't drift apart. `v` (the contract version) is set there.
        body=$(jq -nc \
          --arg repo "$REPO" --arg ref "$REF" --arg instance "$INSTANCE" \
          --arg host_prefix "$HOST_PREFIX" --arg tag "$TAG" --arg action "$ACTION" \
          --argjson secrets "$secrets_json" \
          -f "$GITHUB_ACTION_PATH/body.jq")

        # Never echo $body — it carries secrets (GitHub also masks them). Sign the
        # exact bytes that are POSTed, matching the host's X-Hub-Signature-256 check.
        sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$BERTH_SECRET" -hex | awk '{print $2}')
        printf '%s' "$body" | curl -fsS -X POST "$BERTH_URL" \
          -H 'Content-Type: application/json' \
          -H "X-Hub-Signature-256: sha256=$sig" \
          --data-binary @-
        echo "berth: ${ACTION} ${INSTANCE}"
